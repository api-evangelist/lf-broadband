apis:
  - aid: lf-broadband:voltha
    name: VOLTHA
    description: >-
      VOLTHA (Virtual Optical Line Termination Hardware Abstraction) is an open
      source platform that virtualizes multi-vendor Passive Optical Network
      (PON) hardware, exposing a vendor-agnostic gRPC API for network operators
      to manage PON access networks programmatically.
    humanURL: https://docs.voltha.org/
    tags:
      - PON
      - Network Virtualization
      - Access Networks
      - gRPC
    properties:
      - type: Documentation
        url: https://docs.voltha.org/
      - type: GitHubRepo
        url: https://github.com/opencord/voltha
  - aid: lf-broadband:seba
    name: SEBA
    description: >-
      SEBA (SDN-Enabled Broadband Access) is a reference design for
      constructing open broadband networks, providing a thin platform for
      access-network workloads and integrating VOLTHA, ONOS, and other open
      source components.
    humanURL: https://opennetworking.org/seba/
    tags:
      - SDN
      - Broadband Access
      - Reference Design
    properties:
      - type: Documentation
        url: https://docs.opennetworking.org/seba/
      - type: GitHubOrg
        url: https://github.com/opencord
