aid: lf-broadband
name: LF Broadband
description: >-
  LF Broadband is a Linux Foundation Directed Fund established in late 2023
  that supports open source broadband networking projects, including reference
  designs and virtualization tools for broadband access networks. Its flagship
  projects, SEBA and VOLTHA, virtualize multi-vendor Passive Optical Network
  (PON) systems and are deployed by major operators such as Deutsche Telekom
  and Turk Telekom.
